name: Vías de Portugal

on:
  push:
    branches: [main]
    paths: ['scripts/vias.mjs', '.github/workflows/vias.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: write

jobs:
  vias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/vias.mjs
      - name: Guardar si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vias-pt.json
          git diff --cached --quiet || { git commit -m "datos: vías de Portugal desde OpenStreetMap"; git push; }
